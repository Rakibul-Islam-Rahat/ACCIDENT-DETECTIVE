# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true

# AndroidX
android.useAndroidX=true

# Which architectures to build native libraries for.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# React Native 0.82+ no longer supports disabling the New Architecture —
# it is forced on regardless of this value. Kept at true to match reality
# and avoid the "not supported anymore" warning.
newArchEnabled=true

# Hermes JS engine (false = use JSC instead).
hermesEnabled=true

# Edge-to-edge display support.
edgeToEdgeEnabled=true

# Required with the current React Native Gradle Plugin / AGP: opts out of
# AGP 9's built-in Kotlin + new DSL handling, which otherwise conflicts with
# the explicit `apply plugin: "org.jetbrains.kotlin.android"` in
# app/build.gradle (causes "Cannot add extension with name 'kotlin'").
android.builtInKotlin=false
android.newDsl=false
